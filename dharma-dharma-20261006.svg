<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#F7F1E6"/><rect x="42" y="42" width="996" height="996" fill="none" stroke="#9A8C78" stroke-width="2"/><rect x="58" y="58" width="964" height="964" fill="none" stroke="#C5B9A8" stroke-width="1"/><text x="540" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" fill="#6D665E">A THOUGHT ON DUTY</text><text x="540" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#A65F49">धर्म</text><text x="540" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#292722">Do what is right, even when</text><text x="540" y="462" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#292722">no one is watching.</text><text x="540" y="534" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#A65F49">Let integrity be enough.</text><text x="540" y="750" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#5B554E">Dharma begins where responsibility becomes</text><text x="540" y="790" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#5B554E">more important than recognition.</text><text x="540" y="900" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#7A7168">Original reflection · Inspired by the Hindu concept of Dharma</text><rect x="510" y="952" width="60" height="60" fill="none" stroke="#A65F49" stroke-width="2"/></svg>